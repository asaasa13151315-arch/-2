<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Traffic Escape: Rush Hour</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 30% 0,#dceeff,#718db7);font-family:system-ui,"Hiragino Sans",sans-serif;color:#173454}#app{width:min(100vw,560px);height:min(100svh,900px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#86a8d0,#dceafa 27%,#b6cce7);box-shadow:0 12px 45px #1a355a88}header{height:98px;flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(9px + env(safe-area-inset-top)) 15px 8px}.btn{border:0;border-radius:16px;color:white;background:linear-gradient(#82a9d9,#4e719f);box-shadow:inset 0 2px #fff9,0 4px #385879,0 8px 14px #25405b55;font:800 14px inherit;padding:11px;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:inset 0 2px #fff9,0 1px #385879}#title{text-align:center;color:white;text-shadow:0 2px 2px #2c527d;font-weight:900;line-height:1.05;letter-spacing:.08em}#title small{font-size:11px;display:block}#title b{font-size:23px}.round{width:45px;height:45px;border-radius:50%;padding:0;font-size:20px}.stat{position:absolute;z-index:3;left:50%;top:103px;transform:translateX(-50%);border:3px solid white;border-radius:18px;background:#eff8ff;padding:6px 15px 6px 7px;box-shadow:0 4px #6984a4;font-weight:900}.stat i{font-style:normal;background:#ffad35;border-radius:9px;padding:4px 6px;color:white;margin-right:5px}#stage{position:relative;flex:1;min-height:0;padding:29px 9px 7px}canvas{width:100%;height:100%;display:block;border-radius:25px;touch-action:manipulation}.bottom{height:86px;flex:none;display:flex;justify-content:center;gap:18px;padding:8px 18px calc(9px + env(safe-area-inset-bottom))}.power{width:61px;height:61px;border:0;border-radius:19px;background:linear-gradient(#fff,#d5e7f8);box-shadow:inset 0 2px white,0 4px #6f91b2;color:#466e98;font-size:26px;font-weight:900;position:relative}.power small{position:absolute;right:-5px;bottom:-4px;border:2px solid white;border-radius:8px;background:#f4932e;color:white;font:900 11px system-ui;padding:3px 5px}#toast{position:absolute;z-index:8;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:.2s;background:#193957e8;color:white;border:2px solid #fff8;border-radius:15px;padding:10px 17px;font-weight:900;white-space:nowrap;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#modal{position:absolute;z-index:10;inset:0;display:none;place-items:center;background:#19395788;backdrop-filter:blur(4px)}#modal.on{display:grid}.card{width:82%;border:4px solid white;border-radius:27px;background:linear-gradient(#fff,#def0ff);box-shadow:0 11px #385979;padding:27px;text-align:center}.card h1{color:#f08428;font-size:29px;margin:0}.stars{color:#ffb82e;font-size:39px;text-shadow:0 3px #bd7628;margin:7px}.next{border:0;border-radius:15px;padding:13px 25px;background:linear-gradient(#70d667,#39a54a);box-shadow:inset 0 2px #fff9,0 4px #247737;color:#fff;font:900 17px inherit}@media(max-height:690px){header{height:78px}.stat{top:83px}.bottom{height:73px}.power{width:51px;height:51px;font-size:22px}#title b{font-size:19px}}
</style></head><body><main id="app"><header><button class="btn" id="restart">↻ リトライ</button><div id="title"><small>TRAFFIC ESCAPE</small><b id="level">RUSH HOUR</b></div><button class="btn round" id="sound">♫</button></header><div class="stat"><i>🚙</i>残り <span id="left">56</span> 台</div><div id="stage"><canvas id="cv"></canvas></div><div class="bottom"><button class="power" id="hint">💡<small>3</small></button><button class="power" id="new">↻<small>NEW</small></button></div><div id="toast"></div><div id="modal"><div class="card"><h1>RUSH CLEAR!</h1><div class="stars">★★★</div><p>大渋滞を解消しました！</p><button class="next" id="next">次のラッシュ ▶</button></div></div></main><script>
const cv=document.querySelector('#cv'),x=cv.getContext('2d'),$=s=>document.querySelector(s);let W,H,u,ox,oy,cars=[],busy=false,seed=11,muted=false,hints=3;const COL={r:['#ff6257','#ba2832'],o:['#ff9d34','#d35720'],y:['#ffd64c','#dc921e'],g:['#5cdc5b','#168f50'],c:['#46ddf0','#119cc5'],b:['#4d9cf4','#1f58bf'],p:['#b55ee7','#7024ad'],k:['#f253ad','#b82075']},keys=Object.keys(COL),dir={L:[-1,0,Math.PI],R:[1,0,0],U:[0,-1,-Math.PI/2],D:[0,1,Math.PI/2]};
function rng(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function setup(){let r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);cv.width=r.width*d;cv.height=r.height*d;x.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;u=Math.min(W/10.65,H/14.7);ox=(W-u*10)/2;oy=(H-u*14)/2;draw()}new ResizeObserver(setup).observe($('#stage'));
function overlap(a,b,p=.06){return a.x<b.x+b.w-p&&a.x+a.w>b.x+p&&a.y<b.y+b.h-p&&a.y+a.h>b.y+p}function make(){cars=[];let tries=0;while(cars.length<56&&tries++<20000){let vert=rng()>.5,w=vert?.62:1.48,h=vert?1.48:.62,c={x:.12+rng()*(10-w-.24),y:.12+rng()*(14-h-.24),w,h,d:'R',color:keys[Math.floor(rng()*keys.length)],gone:false,glow:0,shake:0};if(cars.some(o=>overlap(c,o,.22)))continue;let edge=[];if(c.x<.6)edge.push('L');if(c.x+c.w>9.4)edge.push('R');if(c.y<.6)edge.push('U');if(c.y+c.h>13.4)edge.push('D');c.d=edge.length&&rng()<.72?edge[Math.floor(rng()*edge.length)]:['L','R','U','D'][Math.floor(rng()*4)];cars.push(c)}hints=3;$('#hint small').textContent=hints;update();draw()}
function R(c){return{x:ox+c.x*u,y:oy+c.y*u,w:c.w*u,h:c.h*u}}function rr(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r);x.closePath()}function draw(){x.clearRect(0,0,W,H);let bx=ox-u*.22,by=oy-u*.22,bw=u*10.44,bh=u*14.44;x.save();x.shadowColor='#1a385b66';x.shadowBlur=17;x.shadowOffsetY=8;rr(bx,by,bw,bh,25);x.fillStyle='#d2deeb';x.fill();x.restore();rr(bx,by,bw,bh,25);x.fillStyle='#e1eaf3';x.fill();x.save();x.globalAlpha=.3;for(let i=0;i<11;i++)for(let j=0;j<15;j++){x.fillStyle=(i+j)%2?'#b9cadb':'#f4f8fc';rr(ox+i*u-.04*u,oy+j*u-.04*u,u*.075,u*.075,2);x.fill()}x.restore();cars.filter(c=>!c.gone).forEach(car);if(cars.some(c=>c.glow>0||c.shake>0))requestAnimationFrame(draw)}
function car(c){let r=R(c),[a,b]=COL[c.color],sh=Math.sin(c.shake*32)*3*c.shake;r.x+=sh;x.save();x.shadowColor='#172b4788';x.shadowBlur=6;x.shadowOffsetY=4;rr(r.x,r.y,r.w,r.h,u*.14);x.fillStyle=b;x.fill();x.restore();let g=x.createLinearGradient(r.x,r.y,r.x,r.y+r.h);g.addColorStop(0,a);g.addColorStop(.58,a);g.addColorStop(1,b);rr(r.x,r.y,r.w,r.h,u*.14);x.fillStyle=g;x.fill();x.lineWidth=1.2;x.strokeStyle='#fff9';x.stroke();x.save();rr(r.x+2,r.y+2,r.w-4,r.h*.43,u*.1);x.clip();x.fillStyle='#dcf8ff99';x.fill();x.restore();x.fillStyle='#203141';if(c.w>c.h){for(let q of [.18,.72]){x.fillRect(r.x+r.w*q,r.y-2,u*.18,4);x.fillRect(r.x+r.w*q,r.y+r.h-2,u*.18,4)}}else for(let q of [.18,.72]){x.fillRect(r.x-2,r.y+r.h*q,4,u*.18);x.fillRect(r.x+r.w-2,r.y+r.h*q,4,u*.18)}
// Oversized high-contrast arrow: dark outer line + white arrow + thin navy inner line
x.save();x.translate(r.x+r.w/2,r.y+r.h/2);x.rotate(dir[c.d][2]);let L=Math.max(r.w,r.h)*.38,T=Math.min(r.w,r.h)*.29;x.lineJoin='round';x.lineWidth=5;x.strokeStyle='#183755';x.beginPath();x.moveTo(L,0);x.lineTo(L-T,-T*.75);x.lineTo(L-T,-T*.34);x.lineTo(-L,-T*.34);x.lineTo(-L,T*.34);x.lineTo(L-T,T*.34);x.closePath();x.fillStyle='white';x.fill();x.stroke();x.lineWidth=1.2;x.strokeStyle='#6f8394';x.stroke();x.restore();if(c.glow>0){x.save();x.globalAlpha=c.glow;x.lineWidth=5;x.strokeStyle='#ffe63a';rr(r.x-3,r.y-3,r.w+6,r.h+6,u*.18);x.stroke();x.restore();c.glow-=.035}c.shake=Math.max(0,c.shake-.04)}
function clear(c){let q={x:c.x,y:c.y,w:c.w,h:c.h};if(c.d==='L'){q.w=c.x;q.x=0}if(c.d==='R')q.w=10-c.x;if(c.d==='U'){q.h=c.y;q.y=0}if(c.d==='D')q.h=14-c.y;return !cars.some(o=>o!==c&&!o.gone&&overlap(q,o))}function update(){$('#left').textContent=cars.filter(c=>!c.gone).length}function beep(f,t=.07){if(muted)return;try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.055,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+t)}catch(e){}}function say(s){$('#toast').textContent=s;$('#toast').classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>$('#toast').classList.remove('on'),900)}
function go(c){if(busy)return;busy=true;beep(600);let v=0;function f(){v+=.07;c.x+=dir[c.d][0]*v;c.y+=dir[c.d][1]*v;draw();let r=R(c);if(r.x>W+30||r.x+r.w<-30||r.y>H+30||r.y+r.h<-30){c.gone=true;busy=false;update();beep(820,.1);if(!cars.some(q=>!q.gone))setTimeout(()=>$('#modal').classList.add('on'),250);return}requestAnimationFrame(f)}f()}
cv.addEventListener('pointerdown',e=>{if(busy)return;let r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,c=[...cars].reverse().find(q=>{if(q.gone)return false;let z=R(q);return px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h});if(!c)return;if(clear(c))go(c);else{c.shake=1;beep(160,.11);say('この車の前は渋滞中！');draw()}});$('#restart').onclick=()=>make();$('#new').onclick=()=>{seed+=977;make();say('新しい渋滞を生成！')};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'♫'};$('#hint').onclick=()=>{if(!hints)return say('ヒントは使い切りました');let c=cars.find(q=>!q.gone&&clear(q));if(!c)return say('今は動かせる車がありません');hints--;$('#hint small').textContent=hints;c.glow=1;say('黄色く光る車を脱出！');draw()};$('#next').onclick=()=>{seed+=12345;$('#modal').classList.remove('on');make()};make();
</script></main></body></html>
